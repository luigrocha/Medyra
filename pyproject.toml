[project]
name = "medintel"
version = "0.1.0"
description = "Medical Public Data Intelligence Platform — LATAM physicians"
requires-python = ">=3.11"
dependencies = [
    # Core
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "typer>=0.12",
    "rich>=13.7",
    "python-dotenv>=1.0",
    # Data
    "pandas>=2.2",
    "openpyxl>=3.1",
    "polars>=0.20",
    # Normalization / matching
    "phonenumbers>=8.13",
    "email-validator>=2.1",
    "rapidfuzz>=3.6",
    "unidecode>=1.3",
    "dnspython>=2.6",
    # Persistence
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pgvector>=0.2.5",
    # HTTP / scraping
    "httpx>=0.27",
    "tenacity>=8.2",
    "selectolax>=0.3.21",
    "playwright>=1.42",
    # Queue / cache
    "redis>=5.0",
    "rq>=1.16",
    # Observability
    "structlog>=24.1",
    # LLM / embeddings (opcionales, instalar bajo demanda)
    # "anthropic>=0.25",
    # "sentence-transformers>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipython>=8.22",
]
llm = [
    "anthropic>=0.25",
    "sentence-transformers>=2.6",
]

[project.scripts]
medintel = "medintel.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/medintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RET"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
